spring:
  application:
    name: shareway-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shareway}
    username: ${DB_USER:shareway}
    password: ${DB_PASSWORD:shareway}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    # No default on purpose: the application does not start without JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  internal:
    # Service-to-service key: guards /api/v1/internal here and is sent to the internal endpoints of
    # the extracted services unless they have their own. No default on purpose.
    api-key: ${INTERNAL_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
  services:
    # Base URLs of the extracted services (Strangler Fig). Without the Driver Management URL the
    # token claims are used as they are; Payments & Settlement is required by Booking & Pricing.
    driver-management:
      url: ${DRIVER_MANAGEMENT_URL:}
    payments-settlement:
      url: ${PAYMENTS_SETTLEMENT_URL}
      # X-Internal-Api-Key of its /api/v1/internal endpoints; empty uses INTERNAL_API_KEY.
      api-key: ${PAYMENTS_SETTLEMENT_API_KEY:}
    # Connect and read timeout of every call to an extracted service.
    timeout-ms: ${SERVICES_TIMEOUT_MS:3000}

# Booking & Pricing (keys kept from shareway-booking-pricing).
booking:
  reservation:
    # Optimistic-lock retries when several passengers take the same seat at once.
    max-attempts: ${BOOKING_RESERVATION_MAX_ATTEMPTS:3}
    backoff-ms: ${BOOKING_RESERVATION_BACKOFF_MS:20}
  cancellation:
    penalty-window-minutes: ${BOOKING_CANCELLATION_PENALTY_WINDOW_MINUTES:30}
    penalty-percent: ${BOOKING_CANCELLATION_PENALTY_PERCENT:20}
    minimum-penalty-amount: ${BOOKING_CANCELLATION_MINIMUM_PENALTY_AMOUNT:1.00}
  saga:
    payment-timeout-minutes: ${BOOKING_SAGA_PAYMENT_TIMEOUT_MINUTES:15}
    group-timeout-minutes: ${BOOKING_SAGA_GROUP_TIMEOUT_MINUTES:60}
    driver-timeout-minutes: ${BOOKING_SAGA_DRIVER_TIMEOUT_MINUTES:30}
    timeout-job-enabled: ${BOOKING_SAGA_TIMEOUT_JOB_ENABLED:true}
    timeout-job-cron: ${BOOKING_SAGA_TIMEOUT_JOB_CRON:0 * * * * *}
  departure:
    # Departure of every trip group until Trip Planning exposes the real one.
    simulated-offset-minutes: ${BOOKING_DEPARTURE_SIMULATED_OFFSET_MINUTES:120}
