spring:
  application:
    name: shareway-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shareway}
    username: ${DB_USER:shareway}
    password: ${DB_PASSWORD:shareway}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    # No default on purpose: the application does not start without JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  internal:
    # Key of the service-to-service endpoints under /api/v1/internal. No default on purpose.
    api-key: ${INTERNAL_API_KEY}
  admin:
    # Administrator account created on startup when both values are set.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    # Driver documents uploaded through Driver Management.
    path: ${STORAGE_PATH:./storage}
  payments:
    # Platform commission over the gross amount of a trip.
    commission-rate: ${COMMISSION_RATE:0.15}
    # Share of the authorized amount charged for a late cancellation or a no-show.
    penalty-rate: ${PENALTY_RATE:0.50}
    penalty-window-minutes: ${PENALTY_WINDOW_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# Booking & Pricing (keys kept from shareway-booking-pricing).
booking:
  reservation:
    # Optimistic-lock retries when several passengers take the same seat at once.
    max-attempts: ${BOOKING_RESERVATION_MAX_ATTEMPTS:3}
    backoff-ms: ${BOOKING_RESERVATION_BACKOFF_MS:20}
  cancellation:
    penalty-window-minutes: ${BOOKING_CANCELLATION_PENALTY_WINDOW_MINUTES:30}
    penalty-percent: ${BOOKING_CANCELLATION_PENALTY_PERCENT:20}
    minimum-penalty-amount: ${BOOKING_CANCELLATION_MINIMUM_PENALTY_AMOUNT:1.00}
  saga:
    payment-timeout-minutes: ${BOOKING_SAGA_PAYMENT_TIMEOUT_MINUTES:15}
    group-timeout-minutes: ${BOOKING_SAGA_GROUP_TIMEOUT_MINUTES:60}
    driver-timeout-minutes: ${BOOKING_SAGA_DRIVER_TIMEOUT_MINUTES:30}
    timeout-job-enabled: ${BOOKING_SAGA_TIMEOUT_JOB_ENABLED:true}
    timeout-job-cron: ${BOOKING_SAGA_TIMEOUT_JOB_CRON:0 * * * * *}
  departure:
    # Departure of every trip group until Trip Planning exposes the real one.
    simulated-offset-minutes: ${BOOKING_DEPARTURE_SIMULATED_OFFSET_MINUTES:120}
